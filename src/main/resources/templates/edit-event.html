<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <title>Etkinlik Düzenle</title>
    <meta charset="UTF-8"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
    <!--TOAST-->
    <div th:replace="~{fragments/toast :: toast}"></div>
<div class="contianer mt-5">
    <div class="card shadow-sm">
        <div class="card-body">

            <h3 class="mb-4">Etkinliği Düzenle</h3>

            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/events/update/{id}(id = ${event.id})}" th:object="${event}" method="post">

                <!--BAŞLIK-->
                <div class="mb-3">
                    <label>Başlık</label>
                    <input type="text" th:field="*{title}" class="form-control">
                    <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <!--AÇIKLAMA-->
                <div class="mb-3">
                    <label>Açıklama</label>
                    <input type="text" th:field="*{description}" class="form-control">
                    <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>
                <!-- TARİH -->
                <div class="mb-3">
                    <label>Date</label>
                    <input type="date" th:field="*{eventDate}" class="form-control">
                    <div class="text-danger" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
                </div>

                <!-- ZAMAN -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Start Time</label>
                        <input type="time" th:field="*{startTime}" class="form-control">
                        <div class="text-danger" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>End Time</label>
                        <input type="time" th:field="*{endTime}" class="form-control">
                        <div class="text-danger" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
                    </div>
                </div>

                <!-- YER -->
                <div class="mb-3">
                    <label>Location</label>
                    <input type="text" th:field="*{location}" class="form-control">
                    <div class="text-danger" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                </div>

                <!--KATEGORİ-->
                <div class="mb-3">
                    <label>Kategori</label>
                    <select th:field="*{category}" class="from-control">
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">
                        </option>
                    </select>
                </div>

                <!--STATÜ-->
                <div class="mb-3">
                    <label>Statü</label>
                    <select th:field="*{status}">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">
                        </option>
                    </select>
                </div>
                <!-- ÖNCELİK -->
                <div class="mb-3">
                    <label>Öncelik</label>
                    <select th:field="*{priority}" class="form-control">
                        <option th:each="p : ${priorities}" 
                                th:value="${p}" 
                                th:text="${p}">
                        </option>
                    </select>
                </div>

                <!--BUTTONLAR-->
                <button class="btn btn-warning" type="submit">Güncelle</button>
                <a th:href="@{/events}" class="btn btn-secondary">İptal</a>
            </form>
        </div>

    </div>

</div>

</body>


</html>
