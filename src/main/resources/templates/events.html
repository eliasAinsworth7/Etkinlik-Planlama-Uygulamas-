<!DOCTYPE html>
<html xmlns:th = "http://www.thymeleaf.org">
<head>
    <title>Etkinlikler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
</head>

<body class="bg-light">

    <!--TOAST-->
    <div th:replace="~{fragments/toast :: toast}"></div>

    <div class="container mt-5">

        <h1 class="text-center mb-4">Etkinlik Yöneticisi</h1>



        <div class ="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Etkinlik Listesi</h5>
                <a th:href="@{/events/add}" class="btn btn-primary">+ Etkinlik Ekle</a>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Başlık</th>
                            <th>Açıklama</th>
                            <th>Tarih</th>
                            <th style="width:150px;">Seçenekler</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="event : ${events}" >
                            <td th:text="${event.title}"></td>
                            <td th:text="${event.description}"></td>
                            <td th:text="${event.eventDate}"></td>
                            <td>
                                <a th:href="@{/events/edit/{id}(id = ${event.id})}" class="btn btn-sm btn-warning">Düzenle</a>
                                <form th:action="@{/events/delete/{id}(id = ${event.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-sm btn-danger">Sil</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        


    </div>
    
</body>

</html>
