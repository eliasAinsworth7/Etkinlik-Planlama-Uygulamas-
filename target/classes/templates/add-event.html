<!DOCTYPE html>
<html xmlns ="http://www.thymeleaf.org">
<head>
    <title>Etkinlik ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
</head>

<body class="bg-light">  
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">Yeni Etkinlik Ekle</h3>

                <form th:action="@{/events/add}" th:object="${event}"method="post" >

                    <!--BAŞLIK-->
                    <div class="mb-3">
                        <label>Başlık</label>
                        <input type="text" th:field="*{title}" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <!--AÇIKLAMA-->
                    <div clas="mb-3">
                        <label>Açıklama</label>
                        <input type="text" th:field="*{description}" class="form-control"required>
                        <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>
                    <!--TARİH-->
                    <div class="mb-3">
                        <label>Tarih</label>
                        <input type="date" th:field="*{eventDate}" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
                    </div>
                    <!--ZAMAN-->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Başlama Zamanı</label>
                            <input type="time" th:field="*{startTime}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Bitiş Zamanı</label>
                            <input type="time" th:field="*{endTime}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
                        </div>
                    </div>

                    <!--YER-->
                    <div class="mb-3">
                        <label>Yer</label>
                        <input type="text" th:field="*{location}" class="form-control">
                        <div class="text-danger" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                    </div>

                    <!--KATEGORİ-->
                    <div class="mb-3">
                        <label>Kategori</label>
                        <select th:field="*{category}" class="form-control">
                            <option value="">Kategori Seç</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                        </select>
                        <div class="text-danger" th:errors="*{category}"></div>
                    </div>

                    <!--STATÜ-->
                    <div class="mb-3">
                        <label>Statü</label>
                        <select th:field="*{status}" class="form-control">
                            <option value="">Statü Seç</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                        </select>
                        <div class="text-danger" th:errors="*{status}"></div>
                    </div>

                    <!--Öncelik Durumu-->
                    <div class="mb-3">
                        <label>Öncelik Durumu</label>
                        <select th:field="*{priority}" class="form-control">
                            <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                        </select>
                        <div class="text-danger" th:errors="*{priority}"></div>
                    </div>

                    <button type="submit" class="btn btn-success">Ekle</button>
                    <a th:href="@{/events}" class="btn btn-secondary">İptal</a>
                </form>
                <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            </div>
        </div>
    </div>

</body>

</html>
