<!DOCTYPE html>
<html xmlns:th = "http://www.thymeleaf.org">
<head>
    <title>Etkinlikler</title>
</head>

<body>
    <h2>Etkinlik Listesi</h2>

    <div th:each="event : ${events}">
        <p th:text="${event.title}"></p>
        <p th:text="${event.description}"></p>
    </div>

    <a th:href="@{/event/add}">Etkinlik Ekle</a>
</body>

</html>
