<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <meta charset="UTF-8">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm" style="width:420px">
        <div class="card-body">
            <h3 class="text-center mb-4">Kayıt Ol</h3>

            
            <form th:action="@{/register}" method="post" th:object="${registerRequest}">

                <!--Ad Soyad-->
                <div class="mb-3">
                    <label class="form-label">Ad Soyad</label>
                    <input type="text" th:field="*{fullName}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <!--EMAIL-->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <!--ŞİFRE-->
                <div class="mb-3">  
                    <label class="form-label">Şifre</label>
                    <input  type="password" th:field="*{password}" class="form-control"required>
                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Kayıt Ol</button>
                </div>
            </form>

            <hr>

            <p class="text-center mb-0">
                Zaten hesabın var mı? <a th:href="@{/login}">Giriş Yap</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
